name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

  scaffold:
    # A scaffold is only as good as the versions it pins. Generate each kind of
    # project and build it against them, so a pin that no longer compiles fails
    # here rather than in the first project someone scaffolds.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: build mctl
        run: |
          moon update
          moon build --target native

      - name: scaffold and build every kind
        run: |
          mctl="$PWD/_build/native/debug/build/cmd/mctl/mctl.exe"
          work="$(mktemp -d)"
          cd "$work"
          "$mctl" api new demoapi
          "$mctl" rpc new demorpc
          "$mctl" model new demomodel
          mkdir tree && cp demoapi/demoapi.api tree/
          (cd tree && "$mctl" gen api demoapi.api)
          for dir in demoapi demorpc demomodel tree; do
            (cd "$dir" && moon check --target native --deny-warn && moon build --target native)
          done

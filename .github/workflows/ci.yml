name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # Every job below fetches the same packages from mooncakes, and a cold
      # `moon update` is most of the wall clock on a small runner. The cache is the
      # registry (the downloaded and extracted packages), keyed by the module's
      # dependency list, so a bump re-fetches only what changed.
      - name: cache the mooncakes packages
        uses: actions/cache@v6
        with:
          path: ~/.moon/registry
          key: ${{ runner.os }}-mooncakes-${{ hashFiles('moon.mod') }}
          restore-keys: |
            ${{ runner.os }}-mooncakes-

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets = "js"' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      - name: docs (api reference matches the interfaces)
        # The page is generated from the .mbti files above, so it has to be
        # regenerated in the same commit that moves a public signature.
        if: runner.os == 'Linux'
        run: python3 scripts/gen_api_reference.py --check

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skills into a project, so
      # they have to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

  scaffold:
    # A pin that no longer compiles, or a service that no longer answers, fails
    # here rather than in the first project someone scaffolds.
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      # This job scaffolds a project of every kind and builds each one, so it
      # downloads the pinned releases as well as this module's own dependencies:
      # the key covers both lists, and the restore key lets a pin bump reuse the
      # packages that did not move.
      - name: cache the mooncakes packages
        uses: actions/cache@v6
        with:
          path: ~/.moon/registry
          key: ${{ runner.os }}-mooncakes-${{ hashFiles('moon.mod', 'src/scaffold/manifest.mbt') }}
          restore-keys: |
            ${{ runner.os }}-mooncakes-

      - name: build mctl
        run: |
          moon update
          moon build --target native

      - name: scaffold, build and test every kind
        run: |
          mctl="$PWD/_build/native/debug/build/cmd/mctl/mctl.exe"
          work="$(mktemp -d)"
          cd "$work"
          "$mctl" api new demoapi
          "$mctl" rpc new demorpc
          "$mctl" gql new demogql
          "$mctl" mcp new demomcp
          "$mctl" model new demomodel
          for dir in demoapi demorpc demogql demomcp; do
            (cd "$dir" && moon check --target all --deny-warn && moon test --target native)
          done
          (cd demomodel && moon check --target native --deny-warn && moon build --target native)
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"hello","arguments":{"name":"leo"},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
            | (cd demomcp && moon run --target native . -- --stdio) | grep -q 'hello, leo'

      - name: generated code is moon fmt-clean
        run: bash scripts/check_scaffold_fmt.sh "$PWD/_build/native/debug/build/cmd/mctl/mctl.exe"

      # The gateway is generated into a project of its own, not scaffolded by a
      # `new` command, so the step above never sees it. Its matcher and its
      # parameter binding only exist as code, so this compiles the file and drives
      # it through `Caller` instead of comparing text.
      - name: the generated gateway routes and binds
        run: bash scripts/check_gateway.sh "$PWD/_build/native/debug/build/cmd/mctl/mctl.exe"

      # The plugin protocol's decisions are unit-tested; what reaches the plugin —
      # its argv, the request on its stdin, the exit code that decides whether the
      # reply is read, and the temporary file it travels through — is not, and
      # cannot be without a process.
      - name: the plugin spawn path, with real processes
        run: bash scripts/check_plugin_faults.sh "$PWD/_build/native/debug/build/cmd/mctl/mctl.exe"

      # The scaffolds above are generated from the samples mctl ships, which carry
      # neither a streaming route nor a `bytes`/`map` field. Those two paths write
      # code the unit tests can only compare as text, so they are compiled here
      # against the same published releases a user gets.
      - name: a spec with a stream, bytes and a map compiles
        run: |
          mctl="$PWD/_build/native/debug/build/cmd/mctl/mctl.exe"
          work="$(mktemp -d)"
          cd "$work"
          cat > feed.api <<'API'
          type Tick {
            id:   int64
            data: bytes
            meta: map[string]string
          }

          service feed {
            @handler watch
            get /watch returns (stream Tick)

            @handler one
            get /ticks/:id returns (Tick)
          }
          API
          "$mctl" gen api feed.api --dir api
          "$mctl" gen gql feed.api --dir gql
          for dir in api gql; do
            (cd "$dir" && moon check --target all --deny-warn)
          done

      - name: mctl serve --reload, with real processes
        run: bash scripts/check_serve_reload.sh

      - name: regenerate over a scaffold
        run: |
          mctl="$PWD/_build/native/debug/build/cmd/mctl/mctl.exe"
          work="$(mktemp -d)"
          cd "$work"
          "$mctl" rpc new demorpc
          cd demorpc
          "$mctl" gen rpc demorpc.proto | grep -q "kept the"
          moon test --target native
